services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: surplus_capacity
      MYSQL_USER: surplus
      MYSQL_PASSWORD: surplus
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usurplus", "-psurplus"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/surplus_capacity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: surplus
      SPRING_DATASOURCE_PASSWORD: surplus
      JWT_SECRET: change-this-in-production-to-a-long-random-secret
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
